plugins {
    id 'java'
    id 'checkstyle'
    id 'com.github.spotbugs'
    id 'jacoco'
}

description = 'Ballerina - Azure Storage Files Compiler Plugin Tests'

dependencies {
    checkstyle project(':checkstyle')
    checkstyle "com.puppycrawl.tools:checkstyle:${checkstylePluginVersion}"

    testImplementation project(':azure.storage.files-compiler-plugin')
    testImplementation group: 'org.ballerinalang', name: 'ballerina-lang', version: "${ballerinaLangVersion}"
    testImplementation group: 'org.ballerinalang', name: 'ballerina-parser', version: "${ballerinaLangVersion}"
    testImplementation group: 'org.ballerinalang', name: 'ballerina-tools-api', version: "${ballerinaLangVersion}"
    testImplementation group: 'org.testng', name: 'testng', version: "${testngVersion}"
}

checkstyle {
    toolVersion "${project.checkstylePluginVersion}"
    configFile rootProject.file("build-config/checkstyle/build/checkstyle.xml")
    configProperties = ["suppressionFile" : file("${rootDir}/build-config/checkstyle/build/suppressions.xml")]
}

def excludePattern = '**/module-info.java'
tasks.withType(Checkstyle) {
    exclude excludePattern
}

checkstyleTest.dependsOn(":checkstyle:downloadCheckstyleRuleFiles")

spotbugsTest {
    enabled = false
}

// Packs the connector and publishes it to the local Ballerina repository so the sample test
// projects (which declare a repository="local" dependency on ballerinax/azure.storage.files)
// resolve it with the listener compiler plugin bundled inside the bala.
task pushPackageToLocalRepo(type: Exec) {
    dependsOn ':azure.storage.files-native:build'
    dependsOn ':azure.storage.files-compiler-plugin:build'
    workingDir "${project.rootDir}/ballerina"
    commandLine 'sh', '-c', 'bal pack && bal push --repository=local'
}

test {
    dependsOn pushPackageToLocalRepo
    useTestNG {
        suites 'src/test/resources/testng.xml'
    }
    // Resolve every import from the distribution and the local repository, never the network.
    systemProperty 'ballerina.offline.flag', 'true'
    doFirst {
        // The compiler test harness needs a full Ballerina distribution as its environment.
        // Resolve the active one from the CLI so the run works both locally and in CI.
        def balHome = new ByteArrayOutputStream()
        exec {
            commandLine 'bal', 'home'
            standardOutput = balHome
        }
        systemProperty 'ballerina.home', balHome.toString().trim()
    }
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
    }
}
