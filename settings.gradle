pluginManagement {
    plugins {
        id "io.ballerina.plugin" version "${ballerinaGradlePluginVersion}"
        id "com.github.spotbugs" version "${spotbugsPluginVersion}"
        id "de.undercouch.download" version "${downloadPluginVersion}"
        id "net.researchgate.release" version "${releasePluginVersion}"
    }
    repositories {
        gradlePluginPortal()
        maven {
            url = 'https://maven.pkg.github.com/ballerina-platform/*'
            credentials {
                username System.getenv("packageUser")
                password System.getenv("packagePAT")
            }
        }
    }
}

rootProject.name = 'module-ballerinax-azure.storage.files'

include ':azure.storage.files-ballerina'
project(':azure.storage.files-ballerina').projectDir = file("ballerina")

include ':azure.storage.files-native'
project(':azure.storage.files-native').projectDir = file("native")

include ':azure.storage.files-compiler-plugin'
project(':azure.storage.files-compiler-plugin').projectDir = file("compiler-plugin")

include ':azure.storage.files-compiler-plugin-tests'
project(':azure.storage.files-compiler-plugin-tests').projectDir = file("compiler-plugin-tests")

include ':azure.storage.files-examples'
project(':azure.storage.files-examples').projectDir = file("examples")

include ':checkstyle'
project(':checkstyle').projectDir = file("build-config${File.separator}checkstyle")
