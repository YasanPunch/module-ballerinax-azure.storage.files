import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'io.ballerina.plugin'
}

description = 'Ballerina - Azure Storage Files'

def packageName = "azure.storage.files"
def packageOrg = "ballerinax"
def tomlVersion = stripBallerinaExtensionVersion("${project.version}")
def ballerinaTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/Ballerina.toml")
def ballerinaTomlFile = new File("$project.projectDir/Ballerina.toml")
def compilerPluginTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/CompilerPlugin.toml")
def compilerPluginTomlFile = new File("$project.projectDir/CompilerPlugin.toml")

def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-')
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}

ballerina {
    packageOrganization = packageOrg
    module = packageName
    langVersion = project.ballerinaLangVersion
    testCoverageParam = "--code-coverage --coverage-format=xml --excludes=\"modules/**/**\""
    platform = "java21"
}

configurations {
    externalJars
}

dependencies {
    externalJars(group: 'io.ballerina.lib', name: 'data.jsondata-native', version: "${stdlibDataJsonDataVersion}") {
        transitive = false
    }
    externalJars(group: 'io.ballerina.lib', name: 'data.xmldata-native', version: "${stdlibDataXmlDataVersion}") {
        transitive = false
    }
    externalJars(group: 'io.ballerina.lib', name: 'data.csv-native', version: "${stdlibDataCsvVersion}") {
        transitive = false
    }
}

task updateTomlFiles {
    doLast {
        def newBallerinaToml = ballerinaTomlFilePlaceHolder.text
            .replace("@project.version@", project.version)
            .replace("@toml.version@", tomlVersion)
            .replace("@azure.storage.file.share.version@", project.azureStorageFileShareVersion)
            .replace("@azure.storage.common.version@", project.azureStorageCommonVersion)
            .replace("@azure.core.version@", project.azureCoreVersion)
            .replace("@azure.core.http.netty.version@", project.azureCoreHttpNettyVersion)
            .replace("@azure.identity.version@", project.azureIdentityVersion)
            .replace("@msal4j.version@", project.msal4jVersion)
            .replace("@msal4j.persistence.extension.version@", project.msal4jPersistenceExtensionVersion)
            .replace("@jna.version@", project.jnaVersion)
            .replace("@jna.platform.version@", project.jnaPlatformVersion)
            .replace("@azure.json.version@", project.azureJsonVersion)
            .replace("@azure.xml.version@", project.azureXmlVersion)
            .replace("@jackson.version@", project.jacksonVersion)
            .replace("@slf4j.version@", project.slf4jVersion)
            .replace("@data.jsondata.version@", project.stdlibDataJsonDataVersion)
            .replace("@data.xmldata.version@", project.stdlibDataXmlDataVersion)
            .replace("@data.csv.version@", project.stdlibDataCsvVersion)
            .replace("@reactor.core.version@", project.reactorCoreVersion)
            .replace("@reactive.streams.version@", project.reactiveStreamsVersion)
            .replace("@reactor.netty.version@", project.reactorNettyVersion)
            .replace("@netty.version@", project.nettyVersion)
            .replace("@netty.tcnative.version@", project.nettyTcnativeVersion)
        ballerinaTomlFile.text = newBallerinaToml

        def newCompilerPluginToml = compilerPluginTomlFilePlaceHolder.text
            .replace("@project.version@", project.version)
        compilerPluginTomlFile.text = newCompilerPluginToml
    }
}

task commitTomlFiles {
    doLast {
        project.exec {
            ignoreExitValue true
            if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                commandLine 'cmd', '/c', "git commit -m \"[Automated] Update the toml files\" Ballerina.toml Dependencies.toml CompilerPlugin.toml"
            } else {
                commandLine 'sh', '-c', "git commit -m '[Automated] Update the toml files' Ballerina.toml Dependencies.toml CompilerPlugin.toml"
            }
        }
    }
}

clean {
    delete 'build'
    delete 'lib'
}

// Both build and test resolve the native jar through Ballerina.toml, so each needs the
// native module built first (test would otherwise run before the jar exists after a clean).
build.dependsOn ":azure.storage.files-native:build"
test.dependsOn ":azure.storage.files-native:build"

// The package loads the listener compiler plugin through CompilerPlugin.toml, so each needs
// the plugin jar built first (compile-time service validation runs during the package build).
build.dependsOn ":azure.storage.files-compiler-plugin:build"
test.dependsOn ":azure.storage.files-compiler-plugin:build"

// bal and the standard libraries the connector needs come from the unpacked distribution, so
// unpack it and copy the declared ballerinaStdLibs into it before build and test run bal.
unpackStdLibs.dependsOn unpackJballerinaTools
copyStdlibs.dependsOn unpackStdLibs
build.dependsOn copyStdlibs
test.dependsOn copyStdlibs

// The push-to-main build publishes a timestamped snapshot of the package archive to GitHub
// Packages (the createArtifactZip task comes from the io.ballerina.plugin plugin).
publishing {
    publications {
        maven(MavenPublication) {
            artifact source: createArtifactZip, extension: 'zip'
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/ballerina-platform/module-${packageOrg}-${packageName}")
            credentials {
                username = System.getenv("publishUser")
                password = System.getenv("publishPAT")
            }
        }
    }
}

build.dependsOn "generatePomFileForMavenPublication"
publishToMavenLocal.dependsOn build
publish.dependsOn build
